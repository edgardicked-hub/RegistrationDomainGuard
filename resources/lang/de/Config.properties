registration = Registrierung
allowedDomains = Erlaubte E-Mail-Domains
allowedDomainsTooltip = Eine oder mehrere Domains eingeben, z. B. example.com, example.org. Kommas, Semikolons, Leerzeichen und Zeilenumbrueche trennen die Eintraege. Ein fuehrendes @ ist erlaubt. Subdomains muessen einzeln angegeben werden. Eine leere Liste oder ein ungueltiger Eintrag sperrt die Registrierung. Die Regel gilt fuer alle Shops dieses Plugin-Sets.
